<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="55%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#7CFF6B"/>
    </linearGradient>
    <linearGradient id="hexStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2A3A"/>
      <stop offset="100%" stop-color="#0B121C"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="640" height="200" fill="#070B10"/>

  <!-- ICON GROUP -->
  <g transform="translate(100,100)">
    <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36"
             fill="#0D1420" stroke="url(#hexStroke)" stroke-width="2"/>
    <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36"
             fill="none" stroke="#1B2838" stroke-width="1.5"/>
    <polygon points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29"
             fill="none" stroke="#132030" stroke-width="1"/>
    <circle cx="0" cy="0" r="26" fill="#070B10" stroke="#16232F" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="url(#neonGrad)" stroke-width="1" opacity="0.35"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="url(#neonGrad)" stroke-width="1.6" opacity="0.8" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="2.4" fill="url(#neonGrad)" filter="url(#glow)"/>
    <g filter="url(#glow)">
      <path d="M -34,44 L -34,-40 L 6,-40"
            fill="none" stroke="url(#neonGrad)" stroke-width="6"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -34,2 L -6,2"
            fill="none" stroke="url(#neonGrad)" stroke-width="6"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -6,2 L 40,-40"
            fill="none" stroke="url(#neonGrad)" stroke-width="6"
            stroke-linecap="round"/>
      <path d="M 40,-40 L 40,-18 M 40,-40 L 18,-40"
            fill="none" stroke="url(#neonGrad)" stroke-width="6"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- WORDMARK -->
  <g transform="translate(210,118)">
    <text x="0" y="0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="1">Fin</text>
    <text x="98" y="0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="58" font-weight="300" fill="#00E5FF" letter-spacing="1" filter="url(#softGlow)">Sight</text>
    <text x="2" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="13" font-weight="400" fill="#5B6B7A" letter-spacing="4">THE SMART WEALTH MANAGER</text>
  </g>
</svg>
